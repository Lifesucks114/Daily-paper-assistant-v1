name: Daily Paper Assistant

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - all
  schedule:
    - cron: "0 6 * * *"
    - cron: "30 6 * * 1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose run mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * 1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run assistant
        run: python -m src.main --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit generated reports and database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update paper assistant reports"
          file_pattern: "data/papers.db reports/daily/*.md reports/weekly/*.md"
